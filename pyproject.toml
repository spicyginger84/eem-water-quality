[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eem-water-quality"
version = "0.2.0"
description = "BOD/COD/TOC from fluorescence EEMs: literature baselines and kernel models under station CV"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11",
  "scikit-learn>=1.4", "joblib>=1.3",
]

[project.optional-dependencies]
research = ["threadpoolctl>=3.1", "xgboost>=2.0", "lightgbm>=4.0"]
cnn = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
paper = ["openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
eem-quality = "eem_water_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
