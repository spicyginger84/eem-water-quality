[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eem-water-quality"
version = "0.1.0"
description = "Reproducible EEM water-quality regression experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11",
  "scikit-learn>=1.4", "tensorly>=0.8", "joblib>=1.3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2"]
neural = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
eem-quality = "eem_water_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
