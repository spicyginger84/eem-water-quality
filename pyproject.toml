[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eem-water-quality"
version = "0.1.0"
description = "Reproducible EEM water-quality regression experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11",
  "scikit-learn>=1.4", "joblib>=1.3",
]

[project.optional-dependencies]
boosting = ["xgboost>=2"]
plots = ["matplotlib>=3.8"]
notebooks = ["torch>=2.2", "tensorly>=0.9", "threadpoolctl>=3.1", "plotly>=5.18", "matplotlib>=3.9", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
eem-quality = "eem_water_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
